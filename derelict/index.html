<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DERELICT: Escape from Station Echo</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px 0 32px;
    background: #07070c;
    color: #cfd4ee;
    font-family: "Courier New", Courier, monospace;
    display: flex; justify-content: center;
  }
  #wrap { width: 962px; max-width: 100%; }
  #topbar {
    display: flex; justify-content: space-between; align-items: center;
    background: #10122a; border: 2px solid #2c3160; border-bottom: none;
    padding: 4px 10px; font-size: 13px; letter-spacing: 1px;
  }
  #topbar .title { color: #ffd34d; font-weight: bold; }
  #stage { position: relative; line-height: 0; border: 2px solid #2c3160; }
  canvas {
    width: 100%; height: auto; display: block;
    image-rendering: pixelated; image-rendering: crisp-edges;
    cursor: crosshair; background: #000;
  }
  #overlay {
    position: absolute; inset: 0; background: rgba(4,5,14,0.92);
    display: flex; align-items: center; justify-content: center;
    line-height: 1.5; z-index: 5;
  }
  #overlay.hidden { display: none; }
  #ovinner { max-width: 80%; text-align: center; font-size: 15px; }
  #ovinner h1 { color: #ffd34d; font-size: 26px; letter-spacing: 3px; margin: 0 0 4px; }
  #ovinner h1.dead { color: #ff5d5d; }
  #ovinner h2 { color: #7fd6ff; font-size: 14px; letter-spacing: 2px; margin: 0 0 14px; font-weight: normal; }
  #ovinner p { margin: 8px 0; }
  #ovinner .dim { color: #7d83ad; font-size: 12px; }
  #ovinner button {
    font-family: inherit; font-size: 15px; letter-spacing: 1px;
    background: #1c2148; color: #ffd34d; border: 2px solid #4a52a0;
    padding: 8px 22px; margin: 12px 6px 0; cursor: pointer;
  }
  #ovinner button:hover { background: #2a3168; }
  #status {
    background: #0c0d1c; border: 2px solid #2c3160; border-top: none;
    padding: 3px 10px; font-size: 13px; min-height: 22px;
    color: #ffd34d; letter-spacing: 1px;
  }
  #status .hov { color: #7fd6ff; }
  #log {
    background: #0a0a3a; border: 2px solid #2c3160; border-top: none;
    height: 118px; overflow-y: auto; padding: 6px 10px;
    font-size: 13px; line-height: 1.45;
  }
  #log .m { color: #d8dcf6; }
  #log .m.item { color: #ffd34d; }
  #log .m.pts  { color: #6fe3a0; }
  #log .m.hint { color: #7fd6ff; }
  #log .m.die  { color: #ff5d5d; }
  #log .m.room { color: #b08aff; letter-spacing: 1px; }
  #bottom {
    display: flex; gap: 10px; align-items: stretch;
    background: #10122a; border: 2px solid #2c3160; border-top: none;
    padding: 8px 10px;
  }
  #verbs { display: flex; flex-direction: column; flex-wrap: wrap; max-height: 76px; gap: 4px; }
  .vbtn {
    font-family: inherit; font-size: 12px; letter-spacing: 1px;
    background: #1c2148; color: #cfd4ee; border: 1px solid #4a52a0;
    padding: 3px 10px; cursor: pointer; width: 84px;
  }
  .vbtn:hover { background: #2a3168; }
  .vbtn.sel { background: #3a3000; color: #ffd34d; border-color: #ffd34d; }
  .vbtn.alt { color: #7fd6ff; }
  #invwrap { flex: 1; border-left: 1px solid #2c3160; padding-left: 10px; }
  .invlabel { font-size: 11px; color: #7d83ad; letter-spacing: 2px; }
  #inv { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .ibtn {
    font-family: inherit; font-size: 12px;
    background: #101430; color: #ffd34d; border: 1px solid #4a52a0;
    padding: 3px 8px; cursor: pointer;
  }
  .ibtn:hover { background: #2a3168; }
  .ibtn.sel { background: #3a3000; border-color: #ffd34d; }
  #footer { font-size: 11px; color: #555b80; padding: 6px 2px; letter-spacing: 1px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="topbar">
    <span id="roomname">&nbsp;</span>
    <span class="title">DERELICT: ESCAPE FROM STATION ECHO</span>
    <span id="scoreline">Score: 0 of 100</span>
  </div>
  <div id="stage">
    <canvas id="cv" width="320" height="180"></canvas>
    <div id="overlay" class="hidden"><div id="ovinner"></div></div>
  </div>
  <div id="status"><span id="statustext">WALK</span></div>
  <div id="log"></div>
  <div id="bottom">
    <div id="verbs">
      <button class="vbtn sel" data-v="walk">1 WALK</button>
      <button class="vbtn" data-v="look">2 LOOK</button>
      <button class="vbtn" data-v="use">3 USE</button>
      <button class="vbtn" data-v="take">4 TAKE</button>
      <button class="vbtn" data-v="talk">5 TALK</button>
      <button class="vbtn alt" id="hintbtn">H HINT</button>
    </div>
    <div id="invwrap">
      <span class="invlabel">INVENTORY</span>
      <div id="inv"></div>
    </div>
  </div>
  <div id="footer">Click a verb, then click the world &middot; Arrow keys / WASD walk &middot; Right-click cycles verbs &middot; ESC cancels &middot; Progress autosaves</div>
</div>
<script src="game.js"></script>
</body>
</html>
