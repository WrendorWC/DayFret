<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#183558"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" fill="url(#bg)" rx="6"/>

  <!-- Fret lines -->
  <line x1="6"  y1="9" x2="6"  y2="23" stroke="#285078" stroke-width="1"/>
  <line x1="13" y1="9" x2="13" y2="23" stroke="#285078" stroke-width="1"/>
  <line x1="20" y1="9" x2="20" y2="23" stroke="#285078" stroke-width="1"/>
  <line x1="27" y1="9" x2="27" y2="23" stroke="#285078" stroke-width="1"/>

  <!-- Guitar strings -->
  <line x1="4" y1="10" x2="28" y2="10" stroke="#c8dff5" stroke-width="1.2"/>
  <line x1="4" y1="13" x2="28" y2="13" stroke="#c8dff5" stroke-width="1.2"/>
  <line x1="4" y1="16" x2="28" y2="16" stroke="#c8dff5" stroke-width="1.2"/>
  <line x1="4" y1="19" x2="28" y2="19" stroke="#c8dff5" stroke-width="1.2"/>
  <line x1="4" y1="22" x2="28" y2="22" stroke="#c8dff5" stroke-width="1.2"/>
  <line x1="4" y1="25" x2="28" y2="25" stroke="#c8dff5" stroke-width="1.2"/>
</svg>
